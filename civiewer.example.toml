# Public GitHub access works without credentials. Copy to civiewer.toml to run.
[viewer]
refresh_interval = "60s"
discovery_interval = "15m"
history_runs = 30
history_pages = 5
branch = "default"

[[sources]]
name = "github"
provider = "github"
repos = ["actions/checkout"]

# For private repositories or a higher GitHub API allowance, add one credential:
# token_env = "CIVIEWER_GITHUB_TOKEN"
# token_file = "/run/secrets/github-token"
# orgs = ["example-org"]
# users = ["example-user"]
# repos = ["example-owner/example-private-repository"]

# Add named Forgejo instances as separate sources. base_url is the instance root.
# [[sources]]
# name = "forgejo"
# provider = "forgejo"
# base_url = "https://forgejo.example.net"
# token_env = "CIVIEWER_FORGEJO_TOKEN"
# orgs = ["example-org"]
# users = ["example-user"]
# repos = ["example-owner/example-repository"]
