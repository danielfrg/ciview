name: Remove legacy container package

on:
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    name: Remove the original civiewer image
    if: github.repository == 'danielfrg/ciview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Verify and remove only the legacy package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          REPOSITORY = "danielfrg/ciview"
          REPOSITORY_ID = 1419954779
          ORIGINAL_RUN_ID = 38659919982
          ORIGINAL_SHA = "1c02d529ee17ff697b0370255ffa64ddafc24c59"
          ORIGINAL_CREATED_AT = "2026-10-15T00:25:14Z"
          ORIGINAL_UPDATED_AT = "2026-10-15T00:29:17Z"
          EXPECTED_DIGEST = "sha256:ab5268d5a4e1fa54db80fe9cfc0b7c5da0ba2b5ba39ed08d602e340b29f2a646"
          EXPECTED_TAGS = {"latest", "sha-" + ORIGINAL_SHA}
          PACKAGE_PATH = "/users/danielfrg/packages/container/civiewer"
          token = os.environ["GH_TOKEN"]

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def api(method, path):
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ciview-legacy-package-cleanup",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if method == "DELETE":
                          require(response.status == 204, "Package deletion did not return HTTP 204")
                      payload = response.read()
                      return json.loads(payload) if payload else {}
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"GitHub API {method} {path} returned HTTP {error.code}") from None

          def packages():
              visible = []
              for page in range(1, 11):
                  batch = api("GET", f"/users/danielfrg/packages?package_type=container&per_page=100&page={page}")
                  require(isinstance(batch, list), "Unexpected packages response")
                  require(all(isinstance(package, dict) for package in batch), "Invalid package metadata")
                  visible.extend(batch)
                  if len(batch) < 100:
                      return visible
              raise RuntimeError("Unexpectedly many accessible packages")

          def legacy_package(visible):
              matches = [package for package in visible if package.get("name") == "civiewer"]
              require(len(matches) <= 1, "Duplicate legacy package metadata")
              return matches[0] if matches else None

          def timestamp(value):
              require(isinstance(value, str), "Missing version timestamp")
              return datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))

          require(os.environ.get("GITHUB_REPOSITORY") == REPOSITORY, "Unexpected repository")
          require(os.environ.get("GITHUB_REF") == "refs/heads/main", "Cleanup requires main")
          require(os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch", "Manual dispatch required")

          visible = packages()
          package = legacy_package(visible)
          if package is None:
              current = [package for package in visible if package.get("name") == "ciview"]
              require(len(current) == 1 and current[0].get("repository", {}).get("id") == REPOSITORY_ID,
                      "Legacy package is not visible and current package access is unverified; inspect permissions")
              print("Accessible-package listing confirms legacy civiewer is absent; current ciview remains accessible.")
              raise SystemExit(0)
          require(package.get("name") == "civiewer", "Unexpected package name")
          require(package.get("package_type") == "container", "Unexpected package type")
          require(package.get("owner", {}).get("login", "").lower() == "danielfrg", "Unexpected package owner")
          require(package.get("repository", {}).get("id") == REPOSITORY_ID, "Unexpected package repository")

          run = api("GET", f"/repos/{REPOSITORY}/actions/runs/{ORIGINAL_RUN_ID}")
          require(run.get("id") == ORIGINAL_RUN_ID, "Unexpected publisher run")
          require(run.get("repository", {}).get("id") == REPOSITORY_ID, "Unexpected publisher repository")
          require(run.get("head_sha") == ORIGINAL_SHA, "Unexpected publisher commit")
          require(run.get("conclusion") == "success", "Publisher run was not successful")
          require(run.get("run_attempt") == 1, "Publisher run was rerun; inspect manually")
          require(run.get("created_at") == ORIGINAL_CREATED_AT, "Publisher start changed")
          require(run.get("updated_at") == ORIGINAL_UPDATED_AT, "Publisher finish changed")
          started = timestamp(run["created_at"])
          finished = timestamp(run["updated_at"])

          versions = []
          for page in range(1, 11):
              batch = api("GET", f"{PACKAGE_PATH}/versions?per_page=100&page={page}")
              require(isinstance(batch, list), "Unexpected package versions response")
              versions.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise RuntimeError("Unexpectedly many legacy package versions")
          require(versions, "No versions found; inspect package manually")
          require(package.get("version_count") == len(versions), "Package version count changed")

          seen_ids = set()
          expected_versions = 0
          for version in versions:
              version_id = version.get("id")
              require(isinstance(version_id, int) and version_id > 0, "Invalid version ID")
              require(version_id not in seen_ids, "Duplicate version ID")
              seen_ids.add(version_id)
              digest = version.get("name", "")
              require(re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is not None, "Unexpected version digest")
              metadata = version.get("metadata", {})
              require(metadata.get("package_type") == "container", "Unexpected version metadata")
              tags = metadata.get("container", {}).get("tags")
              require(isinstance(tags, list) and all(isinstance(tag, str) for tag in tags), "Invalid image tags")
              require(started <= timestamp(version.get("created_at")) <= finished,
                      "A version was created outside the original publishing run")
              if digest == EXPECTED_DIGEST:
                  require(set(tags) == EXPECTED_TAGS and len(tags) == len(EXPECTED_TAGS),
                          "Original image tags no longer match")
                  expected_versions += 1
              else:
                  require(not tags, "Unexpected tagged image version; refusing deletion")
          require(expected_versions == 1, "Original image digest is missing or duplicated")

          print(f"Verified legacy package with {len(versions)} versions from original run {ORIGINAL_RUN_ID}.")
          api("DELETE", PACKAGE_PATH)
          for attempt in range(3):
              if legacy_package(packages()) is None:
                  print("Deleted ghcr.io/danielfrg/civiewer with HTTP 204 and verified its absence from accessible packages.")
                  break
              time.sleep(2)
          else:
              raise RuntimeError("Legacy package still exists after deletion")
          PY
